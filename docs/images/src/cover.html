<!doctype html>
<!-- docs/images/cover.png (1600×1000: 800×500 CSS at 2x). Render: see docs/images/src/render.sh -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
<style>
  html, body { margin: 0; }
  body {
    width: 800px; height: 500px; overflow: hidden; position: relative;
    background:
      radial-gradient(ellipse 70% 80% at 80% 70%, #1c2a52 0%, transparent 70%),
      linear-gradient(160deg, #141a26 0%, #161d33 55%, #1a2448 100%);
    color: #eef1f6;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .copy { position: absolute; left: 56px; top: 98px; width: 330px; }
  .eyebrow { color: #5b9cf6; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; }
  h1 { margin: 10px 0 8px; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .tagline { margin: 0; color: #9aa6bd; font-size: 17px; line-height: 1.35; }
  ul { list-style: none; margin: 34px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  li { position: relative; padding-left: 18px; font-size: 15px; color: #e6e9ef; }
  li::before { content: ''; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #5b9cf6; }
  .stage { position: absolute; right: 64px; top: 50%; transform: translateY(-50%); perspective: 1400px; }
  /* A soft blue glow under the panel, so it reads as lifted off the background. */
  .stage::before {
    content: ''; position: absolute; inset: 12% -6% -4% 10%;
    background: radial-gradient(closest-side, rgba(70, 120, 255, 0.28), transparent);
    filter: blur(24px); transform: translate(18px, 26px);
  }
  .frame {
    position: relative;
    border: 1px solid #3a404d; border-radius: 14px; overflow: hidden;
    zoom: 0.8;
    transform: rotateY(-10deg) rotateX(5deg) rotateZ(1deg);
    transform-origin: 40% 50%;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      -2px 2px 0 #0d0f14,
      -6px 8px 0 rgba(8, 10, 16, 0.6),
      -18px 30px 40px rgba(0, 0, 0, 0.45),
      -40px 70px 90px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<div class="copy">
  <div class="eyebrow">ORCA PLUGIN</div>
  <h1>Snippets</h1>
  <p class="tagline">Save the commands and prompts<br>you use every day.</p>
  <ul>
    <li>Run in a terminal with one click</li>
    <li>Insert to edit before running</li>
    <li>Copy to the clipboard</li>
    <li>Search by name or content</li>
  </ul>
</div>
<div class="stage"><div class="frame"><div id="panel"></div></div></div>
<script src="panel.js"></script>
<script>
drawPanel(document.getElementById('panel'), {
  terminal: 'Claude Code',
  snippets: [
    { name: 'Run tests', body: 'pnpm test --watch=false' },
    { name: 'Review prompt', body: 'Review this branch for bugs' }
  ]
})
</script>
</body>
</html>
