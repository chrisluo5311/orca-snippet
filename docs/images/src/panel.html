<!doctype html>
<!-- docs/images/panel.png. Render: see docs/images/src/render.sh -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
<style>html, body { margin: 0; background: #171717; }</style>
</head>
<body>
<div id="panel"></div>
<script src="panel.js"></script>
<script>
drawPanel(document.getElementById('panel'), {
  terminal: 'Claude Code',
  snippets: [
    { name: 'Run tests', body: 'pnpm test --watch=false' },
    { name: 'Review prompt', body: 'Review the diff on this branch for bugs and missing tests.' },
    { name: 'Git status', body: 'git status -sb' }
  ]
})
// render.sh reads this to size the screenshot to the panel.
document.body.dataset.height = Math.ceil(document.getElementById('panel').getBoundingClientRect().height)
</script>
</body>
</html>
